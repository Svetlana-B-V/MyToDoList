<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f9f7fc">

    <!-- Устанавливаем тему ДО отрисовки, чтобы не было «вспышки» -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>

    <link rel="stylesheet" href="assets/styles/style.css">
    <title>Список дел</title>
</head>
<body>
    <div class="app-container">
        <!-- Левая половина: Календарь -->
        <section class="calendar-section">
            <div class="calendar-header">
                <button id="prevMonthBtn" class="month-nav">&lt;</button>
                <h2 id="currentMonthYear"></h2>

                <div class="calendar-header__actions">
                    <button id="nextMonthBtn" class="month-nav">&gt;</button>

                    <!-- Анимированный переключатель темы -->
                    <button id="themeToggle" class="theme-toggle" type="button"
                            aria-label="Переключить тему" aria-pressed="false">
                        <span class="theme-toggle__track">
                            <span class="theme-toggle__stars" aria-hidden="true">
                                <span></span><span></span><span></span>
                            </span>
                            <span class="theme-toggle__knob">
                                <svg class="theme-toggle__icon theme-toggle__icon--sun"
                                     viewBox="0 0 24 24" aria-hidden="true">
                                    <circle cx="12" cy="12" r="4.4" fill="currentColor"/>
                                    <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                        <path d="M12 2.2v2.4M12 19.4v2.4M4.1 4.1l1.7 1.7M18.2 18.2l1.7 1.7
                                                 M2.2 12h2.4M19.4 12h2.4M4.1 19.9l1.7-1.7M18.2 5.8l1.7-1.7"/>
                                    </g>
                                </svg>
                                <svg class="theme-toggle__icon theme-toggle__icon--moon"
                                     viewBox="0 0 24 24" aria-hidden="true">
                                    <path fill="currentColor"
                                          d="M20.7 14.9A8.7 8.7 0 0 1 9.1 3.3 8.8 8.8 0 1 0 20.7 14.9z"/>
                                </svg>
                            </span>
                        </span>
                    </button>
                </div>
            </div>

            <div class="weekdays">
                <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
            <p id="selectedDateInfo" class="selected-date-info"></p>
        </section>

        <!-- Правая половина: Список дел -->
        <section class="todo-section">
            <h1>Мои задачи</h1>

            <!-- Форма добавления задачи -->
            <div class="add-task-panel">
                <div class="main-input-row">
                    <input type="text" id="taskInput" placeholder="Новая задача...">
                    <button id="addTaskBtn" class="gradient-btn">Добавить</button>
                </div>
                <div class="extra-options">
                    <div class="option-group">
                        <label for="dueDateInput">Дата: </label>
                        <input type="date" id="dueDateInput">
                    </div>
                    <div class="option-group">
                        <label for="prioritySelect">Приоритет: </label>
                        <select id="prioritySelect">
                            <option value="low">Низкий</option>
                            <option value="medium" selected>Средний</option>
                            <option value="high">Высокий</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Контейнер для задач -->
            <div id="tasksContainer" class="tasks-container"></div>
        </section>
    </div>

    <script src="assets/scripts/script.js"></script>
</body>
</html>
